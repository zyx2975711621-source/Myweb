<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 美食记录</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="register">
<div id="nav-root"></div>
<main class="page" style="display:flex;align-items:center;justify-content:center;min-height:70vh">
  <form class="form-card narrow" id="form" style="width:100%">
    <h1>注册</h1>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <p class="hint">2-20 位字母、数字、下划线、点或短横线</p>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <p class="hint">至少 6 位</p>
    <div class="msg" id="msg"></div>
    <button class="submit-btn" type="submit">创建账号</button>
    <div class="alt-center">已有账号？<a href="/login.html">去登录</a></div>
    <div class="alt-center"><a href="/">← 返回美食展示</a></div>
  </form>
</main>
<script src="/app.js"></script>
<script>
  var form = document.getElementById("form");
  var msg = document.getElementById("msg");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    msg.textContent = "";
    api("/api/register", {
      method: "POST", silent401: true,
      json: { username: form.username.value.trim(), password: form.password.value }
    }).then(function () { location.href = "/"; })
      .catch(function (e) { msg.textContent = e.message; });
  });
  initPage();
</script>
</body>
</html>
